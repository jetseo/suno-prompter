<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno AI Prompter</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#080c10;--surface:#0e1318;--surface2:#141a22;--surface3:#1c242e;
      --border:rgba(255,255,255,0.07);--border-bright:rgba(255,255,255,0.15);
      --accent:#00e5a0;--accent2:#00b8ff;--accent3:#ff6b6b;
      --text:#e8edf2;--text2:#8a9ab0;--text3:#4a5a6a;--yellow:#ffd93d;
      --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;}
    body{background:var(--bg);font-family:var(--sans);color:var(--text);display:flex;flex-direction:column;}
    .header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
    .logo{display:flex;align-items:center;gap:10px;}
    .logo-dot{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;}
    .logo-text{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0.08em;color:var(--accent);}
    .logo-sub{font-size:10px;color:var(--text3);letter-spacing:0.04em;}
    .tab-strip{display:flex;gap:4px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
    .tab-strip::-webkit-scrollbar{display:none;}
    .tab{display:flex;align-items:center;gap:5px;padding:7px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:500;color:var(--text3);background:none;transition:all 0.15s;white-space:nowrap;font-family:var(--sans);}
    .tab:hover{border-color:var(--border-bright);color:var(--text2);}
    .tab.active{background:var(--accent);color:#000;border-color:var(--accent);}
    .tab.done{border-color:rgba(0,229,160,0.3);color:var(--accent);}
    .tab .check{display:none;font-size:10px;}
    .tab.done .check{display:inline;}
    .main{display:grid;grid-template-columns:330px 1fr 280px;flex:1;overflow:hidden;}
    .panel{overflow-y:auto;overflow-x:hidden;padding:18px;scrollbar-width:thin;scrollbar-color:var(--surface3) transparent;}
    .panel::-webkit-scrollbar{width:4px;}
    .panel::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px;}
    .left-panel{border-right:1px solid var(--border);}
    .mid-panel{border-right:1px solid var(--border);}
    .panel-title{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--text3);text-transform:uppercase;margin-bottom:16px;}
    .section-label{font-size:11px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;margin-top:16px;}
    .section-label:first-of-type{margin-top:0;}
    .btn-grid{display:flex;flex-wrap:wrap;gap:6px;}
    .sel-btn{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;transition:all 0.15s;font-family:var(--sans);}
    .sel-btn:hover{border-color:var(--border-bright);color:var(--text);}
    .sel-btn.selected{background:rgba(0,229,160,0.12);border-color:var(--accent);color:var(--accent);}
    .bpm-display{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--accent);letter-spacing:-0.02em;margin-bottom:10px;}
    .bpm-display span{font-size:16px;color:var(--text3);margin-left:4px;}
    .bpm-slider{width:100%;height:4px;border-radius:2px;background:var(--surface3);appearance:none;outline:none;cursor:pointer;margin-bottom:10px;}
    .bpm-slider::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(0,229,160,0.5);}
    .bpm-input-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
    .bpm-num{width:70px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px;outline:none;}
    .bpm-num:focus{border-color:var(--accent);}
    .bpm-hint{font-size:11px;color:var(--text3);}
    .preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px;}
    .preset-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;transition:all 0.15s;}
    .preset-card:hover{border-color:var(--border-bright);}
    .preset-card.selected{border-color:var(--accent);background:rgba(0,229,160,0.07);}
    .preset-name{font-size:12px;font-weight:500;color:var(--text);}
    .preset-bpm{font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:1px;}
    .preset-desc{font-size:10px;color:var(--text3);margin-top:2px;}
    .text-inp{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:12px;padding:10px 12px;border-radius:8px;outline:none;resize:vertical;min-height:70px;line-height:1.5;}
    .text-inp:focus{border-color:var(--accent);}
    .text-inp::placeholder{color:var(--text3);}
    .reset-row{display:flex;justify-content:flex-end;margin-top:18px;}
    .reset-btn{background:none;border:1px solid var(--border);color:var(--text3);font-size:11px;font-family:var(--sans);padding:6px 14px;border-radius:6px;cursor:pointer;transition:all 0.15s;}
    .reset-btn:hover{border-color:var(--accent3);color:var(--accent3);}
    .mid-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .save-btn{background:none;border:1px solid var(--border);color:var(--text3);font-size:10px;font-family:var(--sans);padding:5px 11px;border-radius:5px;cursor:pointer;transition:all 0.15s;}
    .save-btn:hover{border-color:var(--accent2);color:var(--accent2);}
    .status-badge{padding:10px 13px;border-radius:8px;font-size:12px;margin-bottom:14px;border:1px solid;line-height:1.4;}
    .status-ok{background:rgba(0,229,160,0.08);border-color:rgba(0,229,160,0.25);color:var(--accent);}
    .status-warn{background:rgba(255,217,61,0.08);border-color:rgba(255,217,61,0.25);color:var(--yellow);}
    .status-empty{background:rgba(138,154,176,0.08);border-color:rgba(138,154,176,0.12);color:var(--text3);}
    .sum-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);gap:10px;}
    .sum-row:last-child{border-bottom:none;}
    .sum-key{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;min-width:55px;padding-top:1px;flex-shrink:0;}
    .sum-val{font-size:12px;color:var(--text);text-align:right;flex:1;}
    .sum-val.empty{color:var(--text3);font-style:italic;}
    .sum-val.bpm{font-family:var(--mono);color:var(--accent);}
    .prompt-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px;font-family:var(--mono);font-size:11px;color:var(--text);line-height:1.7;min-height:130px;word-break:break-word;margin-bottom:8px;}
    .prompt-box.empty{color:var(--text3);font-family:var(--sans);font-style:italic;font-size:12px;}
    .char-count{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;margin-bottom:10px;}
    .char-count .over{color:var(--accent3);}
    .copy-btn{width:100%;background:var(--accent);border:none;color:#000;font-family:var(--sans);font-size:12px;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;transition:all 0.15s;margin-bottom:14px;}
    .copy-btn:hover{background:#00ffb2;}
    .copy-btn:active{transform:scale(0.98);}
    .copy-btn.copied{background:var(--surface3);color:var(--accent);border:1px solid var(--accent);}
    .mod-title{font-size:11px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:9px;}
    .mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .mod-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:11px;font-family:var(--sans);padding:8px 10px;border-radius:7px;cursor:pointer;transition:all 0.15s;text-align:center;}
    .mod-btn:hover{border-color:var(--accent2);color:var(--accent2);}
    .mod-btn.active{background:rgba(0,184,255,0.1);border-color:var(--accent2);color:var(--accent2);}
    .mod-result{margin-top:10px;background:var(--surface2);border:1px solid rgba(0,184,255,0.2);border-radius:8px;padding:11px;font-family:var(--mono);font-size:10px;color:var(--text);line-height:1.6;word-break:break-word;}
    .genre-hint{font-size:11px;color:var(--accent);margin-bottom:8px;}
    /* TOOLTIP */
    .tip-wrap{position:relative;display:inline-block;}
    .tip-wrap .tooltip{
      visibility:hidden;opacity:0;
      position:absolute;bottom:calc(100% + 7px);left:50%;
      transform:translateX(-50%) translateY(3px);
      background:#1c2a38;border:1px solid rgba(0,229,160,0.22);
      color:#a0b4c8;font-size:11px;font-family:var(--sans);line-height:1.5;
      padding:7px 10px;border-radius:7px;
      width:max-content;max-width:200px;white-space:normal;
      box-shadow:0 4px 16px rgba(0,0,0,0.55);
      pointer-events:none;transition:opacity 0.15s,transform 0.15s;
      z-index:9999;
    }
    .tip-wrap:hover .tooltip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0);}
    .tip-wrap .tooltip::after{
      content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
      border:5px solid transparent;border-top-color:#1c2a38;
    }
    #resetAllBtn{background:none;border:1px solid var(--border);color:var(--text3);font-size:11px;font-family:var(--sans);padding:6px 14px;border-radius:6px;cursor:pointer;transition:all 0.15s;}
    #resetAllBtn:hover{border-color:var(--accent3);color:var(--accent3);}
    .header-actions{display:flex;align-items:center;gap:10px;}
    .header-link{font-family:var(--sans);font-size:11px;color:var(--accent2);border:1px solid var(--border);border-radius:6px;padding:6px 12px;text-decoration:none;white-space:nowrap;background:transparent;cursor:pointer;transition:all .15s;}
    .header-link:hover{border-color:var(--accent2);}
    .header-link.copied{color:var(--accent);border-color:var(--accent);}
    .header-ver{font-family:var(--mono);font-size:11px;color:var(--text3);white-space:nowrap;}

    /* ---------- Responsive (tablet / mobile) ---------- */
    @media (max-width: 860px){
      html,body{height:auto;min-height:100%;overflow:visible;}
      body{overflow-x:hidden;}
      .header{flex-wrap:wrap;padding:12px 14px;}
      .header-actions{flex-wrap:wrap;row-gap:8px;}
      .tab-strip{padding:8px 12px;}
      /* Selections stay first, but the generated prompt (right panel) moves
         up to sit right after them — otherwise on mobile it lands below the
         summary panel, far off-screen from where the user is tapping. */
      .main{display:flex;flex-direction:column;overflow:visible;}
      .panel{overflow-y:visible;max-height:none;}
      .left-panel{order:1;border-right:none;border-bottom:1px solid var(--border);}
      .right-panel{order:2;border-bottom:1px solid var(--border);}
      .mid-panel{order:3;border-right:none;}
    }
    @media (max-width: 480px){
      .logo-sub{display:none;}
      .logo-text{font-size:12px;}
      .tab{padding:6px 11px;font-size:11px;}
      .bpm-display{font-size:32px;}
      .preset-grid{grid-template-columns:1fr;}
      .mod-grid{grid-template-columns:1fr;}
      .header-link,#resetAllBtn{font-size:10px;padding:5px 10px;}
    }
  </style>
</head>

// ─── 툴팁 헬퍼 ───
function tip(label, desc) {
  if (!desc) return `<button`;
  return `<div class="tip-wrap"><button`;
}
function tipClose(desc) {
  if (!desc) return '';
  return `<span class="tooltip">${desc}</span></div>`;
}

// 버튼 + 툴팁을 한번에 생성하는 헬퍼
function makeBtn(cls, onclick, label, desc) {
  if (desc) {
    return `<div class="tip-wrap"><button class="${cls}" ${onclick}>${label}</button><span class="tooltip">${desc}</span></div>`;
  }
  return `<button class="${cls}" ${onclick}>${label}</button>`;
}

// ─── STATE ───
let S = {
  tab:0, region:null, country:null, genre:null,
  stories:[], moods:[], bpm:107, bpmPreset:null, bpmTouched:false,
  instruments:[], vocal:null, customStory:'',
  extras:[], modifiers:[], copied:false,
  songForm:null, songFormCopied:false,
};

// ─── PROMPT BUILDER (영문 출력) ───
function buildPrompt(mods=[]) {
  const parts = [];
  if (S.genre) parts.push(GENRE_EN[S.genre] || S.genre);
  S.moods.forEach(m => { const i=MOODS_KO.indexOf(m); parts.push(i>=0?MOODS_EN[i]:m); });
  if (S.bpm) parts.push(S.bpm + ' BPM');
  S.instruments.forEach(inst => {
    const bi = INSTR_BASE_KO.indexOf(inst);
    if (bi>=0) { parts.push(INSTR_BASE_EN[bi]); return; }
    const genre = Object.keys(INSTR_BY_GENRE_KO).find(g => INSTR_BY_GENRE_KO[g].includes(inst));
    if (genre) { const gi=INSTR_BY_GENRE_KO[genre].indexOf(inst); parts.push(INSTR_BY_GENRE_EN[genre][gi]); return; }
    parts.push(inst);
  });
  if (S.vocal) { const vi=VOCALS_KO.indexOf(S.vocal); parts.push(vi>=0?VOCALS_EN[vi]:S.vocal); }
  S.stories.forEach(id => {
    const st = STORIES_KO.find(x=>x.id===id);
    const val = st?.id==='custom' ? S.customStory : st?.en;
    if (val) parts.push('about ' + val);
  });
  S.extras.forEach(e => { const ei=EXTRAS_KO.indexOf(e); parts.push(ei>=0?EXTRAS_EN[ei]:e); });
  if (mods.length) mods.forEach(m => { const mi=MODIFIERS_KO.indexOf(m); if(mi>=0) parts.push(MODIFIERS_EN[mi]); });
  return parts.join(', ');
}

function getStatus() {
  const filled = [S.genre,S.moods.length,S.bpm,S.instruments.length,S.vocal].filter(Boolean).length;
  if (filled===0) return {type:'empty',msg:'왼쪽 패널에서 항목을 선택하면 영문 프롬프트가 생성됩니다.'};
  if (S.moods.length===1) return {type:'warn',msg:'무드를 2개 이상 고르면 더 자연스러운 프롬프트가 됩니다.'};
  if (filled>=4) return {type:'ok',msg:'현재 조합은 비교적 안정적입니다.'};
  return {type:'warn',msg:'더 많은 항목을 선택할수록 풍부한 프롬프트가 완성됩니다.'};
}

function isDone(i) {
  return [!!S.genre,S.stories.length>0,S.moods.length>0,S.bpmTouched,S.instruments.length>0,!!S.vocal,S.extras.length>0][i];
}

// ─── RENDER ───
function renderTabs() {
  document.getElementById('tabStrip').innerHTML = TAB_NAMES.map((n,i)=>{
    const cls=S.tab===i?'tab active':isDone(i)?'tab done':'tab';
    return `<button class="${cls}" onclick="setTab(${i})"><span class="check">✓</span>${i+1} ${n}</button>`;
  }).join('');
}

  let html = `<div class="panel-title">${TAB_NAMES[S.tab]}</div>`;

    html += `<div class="section-label">1. 지역 선택</div><div class="btn-grid">

      ${S.region?countries.map(c=>`<button class="sel-btn ${S.country===c?'selected':''}" onclick="setCountry('${c}')">${c}</button>`).join(''):'<span style="font-size:12px;color:var(--text3)">지역을 먼저 선택하세요</span>'}
    </div>

  } else if (t===1) {
    html += `<div class="section-label">스토리 테마 (복수 선택)</div><div class="btn-grid">
      ${STORIES_KO.map(s=>makeBtn(`sel-btn ${S.stories.includes(s.id)?'selected':''}`,`onclick="toggleStory('${s.id}')"`,s.label,s.desc||'')).join('')}
    </div>
    ${S.stories.includes('custom')?`<div class="section-label" style="margin-top:14px">직접 입력 (영문 권장)</div>
      <textarea class="text-inp" placeholder="e.g. a journey through forgotten memories" oninput="setCustom(this.value)">${S.customStory}</textarea>`:''}`;
  } else if (t===2) {
    html += `<div class="section-label">분위기 (복수 선택)</div><div class="btn-grid">
      ${MOODS_KO.map(m=>makeBtn(`sel-btn ${S.moods.includes(m)?'selected':''}`,`onclick="toggleMood('${m}')"`,m,MOOD_DESC[m]||'')).join('')}

  } else if (t===3) {
    html += `<div class="bpm-display">${S.bpm}<span>BPM</span></div>
    <input type="range" class="bpm-slider" min="40" max="200" step="1" value="${S.bpm}" oninput="setBpm(+this.value)">
    <div class="bpm-input-row">
      <input type="number" class="bpm-num" min="40" max="200" value="${S.bpm}" oninput="setBpm(Math.min(200,Math.max(40,+this.value||107)))">
      <span class="bpm-hint">직접 입력 가능</span>
    </div>
    <div class="preset-grid">
      ${BPM_PRESETS.map((p,i)=>`<div class="preset-card ${S.bpmPreset===i?'selected':''}" onclick="setBpmPreset(${i},${p.bpm})">
        <div class="preset-name">${p.ko}</div>
        <div class="preset-bpm">${p.bpm} BPM</div>
        <div class="preset-desc">${p.desc}</div>
      </div>`).join('')}
    </div>`;
  } else if (t===4) {
    const genreKey = S.genre && INSTR_BY_GENRE_KO[S.genre] ? S.genre : null;
    const extra = genreKey ? INSTR_BY_GENRE_KO[genreKey] : [];
    const all = [...new Set([...extra, ...INSTR_BASE_KO])];
    html += (extra.length?`<div class="genre-hint">✦ ${S.genre} 추천 악기 포함</div>`:'') +
      `<div class="section-label">악기 (복수 선택)</div><div class="btn-grid">
        ${all.map(inst=>{ const desc=INSTR_BASE_DESC[inst]||''; const cls=`sel-btn ${S.instruments.includes(inst)?'selected':''}`; const att=`onclick="toggleInstByEl(this)" data-val="${inst}"`; return makeBtn(cls,att,inst,desc); }).join('')}

  } else if (t===5) {
    html += `<div class="section-label">보컬 스타일</div><div class="btn-grid">
      ${VOCALS_KO.map((v,i)=>makeBtn(`sel-btn ${S.vocal===v?'selected':''}`,`onclick="setVocalIdx(${i})"`,v,VOCAL_DESC[v]||'')).join('')}

  } else if (t===6) {
    html += `<div class="section-label">기타 사항 (복수 선택)</div><div class="btn-grid">
      ${EXTRAS_KO.map((e,i)=>makeBtn(`sel-btn ${S.extras.includes(e)?'selected':''}`,`onclick="toggleExtraIdx(${i})"`,e,EXTRAS_DESC[e]||'')).join('')}
    </div>`;
  }

  html += `<div class="reset-row"><button class="reset-btn" onclick="resetTab()">초기화</button></div>`;
  document.getElementById('leftPanel').innerHTML = html;
}

  const st = getStatus();

  }).filter(Boolean).join(', ')||'-';

  const rows = [

function renderRight() {
  const prompt = buildPrompt();

  document.getElementById('rightPanel').innerHTML = `

function render() { renderTabs(); renderLeft(); renderMid(); renderRight(); }

// ─── 특수문자 이스케이프 ───
function r(s){ return s.replace(/'/g,"\\'"); }

// ─── HANDLERS ───
function setTab(i){S.tab=i;render();}
function setRegion(v){S.region=v;S.country=null;S.genre=null;render();}
function setCountry(v){S.country=v;S.genre=null;render();}
function setGenre(v){S.genre=v;render();}
function toggleStory(id){S.stories=S.stories.includes(id)?S.stories.filter(x=>x!==id):[...S.stories,id];render();}
function setCustom(v){S.customStory=v;}
function toggleMood(m){S.moods=S.moods.includes(m)?S.moods.filter(x=>x!==m):[...S.moods,m];render();}
function setBpm(v){S.bpm=v;S.bpmPreset=null;S.bpmTouched=true;render();}
function setBpmPreset(i,bpm){S.bpm=bpm;S.bpmPreset=i;S.bpmTouched=true;render();}
function toggleInstByEl(el){const inst=el.dataset.val;S.instruments=S.instruments.includes(inst)?S.instruments.filter(x=>x!==inst):[...S.instruments,inst];render();}
function toggleInst(inst){S.instruments=S.instruments.includes(inst)?S.instruments.filter(x=>x!==inst):[...S.instruments,inst];render();}
function toggleInstIdx(idx, val){toggleInst(val||'');}
function setVocal(v){S.vocal=v;render();}
function setVocalIdx(i){S.vocal=VOCALS_KO[i];render();}
function toggleExtra(e){S.extras=S.extras.includes(e)?S.extras.filter(x=>x!==e):[...S.extras,e];render();}
function toggleExtraIdx(i){toggleExtra(EXTRAS_KO[i]);}
function toggleMod(m){S.modifiers=S.modifiers.includes(m)?S.modifiers.filter(x=>x!==m):[...S.modifiers,m];render();}
function toggleModIdx(i){toggleMod(MODIFIERS_KO[i]);}
function setSongForm(i){S.songForm=S.songForm===i?null:i;S.songFormCopied=false;render();}
function copySongForm(){
  if(S.songForm===null)return;
  const text=SONG_FORMS[S.songForm].tags.map(t=>'['+t+']').join('\n\n');
  navigator.clipboard.writeText(text).then(()=>{
    S.songFormCopied=true;render();
    setTimeout(()=>{S.songFormCopied=false;render();},2000);
  });
}
function resetAll(){
  S={tab:S.tab,region:null,country:null,genre:null,stories:[],moods:[],bpm:107,bpmPreset:null,bpmTouched:false,instruments:[],vocal:null,customStory:'',extras:[],modifiers:[],copied:false,songForm:null,songFormCopied:false};
  render();
}
function resetTab(){
  const t=S.tab;
  if(t===0){S.region=null;S.country=null;S.genre=null;}
  else if(t===1){S.stories=[];S.customStory='';}
  else if(t===2){S.moods=[];}
  else if(t===3){S.bpm=107;S.bpmPreset=null;S.bpmTouched=false;}
  else if(t===4){S.instruments=[];}
  else if(t===5){S.vocal=null;}
  else if(t===6){S.extras=[];}
  render();
}
function copyPrompt(){
  const p=buildPrompt(S.modifiers);
  if(!p)return;
  navigator.clipboard.writeText(p).then(()=>{
    S.copied=true;render();
    setTimeout(()=>{S.copied=false;render();},2000);
  });
}
function saveCSV(){
  const rows=[
    ['카테고리','선택값 (한글)','영문 프롬프트'],
    ['스타일',[S.region,S.country,S.genre].filter(Boolean).join(' › '),GENRE_EN[S.genre]||S.genre||''],
    ['분위기',S.moods.join(', '),S.moods.map(m=>{const i=MOODS_KO.indexOf(m);return i>=0?MOODS_EN[i]:m;}).join(', ')],
    ['템포',S.bpm+'BPM',S.bpm+' BPM'],
    ['악기',S.instruments.join(', '),S.instruments.map(inst=>{const bi=INSTR_BASE_KO.indexOf(inst);if(bi>=0)return INSTR_BASE_EN[bi];const g=Object.keys(INSTR_BY_GENRE_KO).find(g=>INSTR_BY_GENRE_KO[g].includes(inst));if(g){const gi=INSTR_BY_GENRE_KO[g].indexOf(inst);return INSTR_BY_GENRE_EN[g][gi];}return inst;}).join(', ')],
    ['보컬',S.vocal||'',S.vocal?(VOCALS_EN[VOCALS_KO.indexOf(S.vocal)]||S.vocal):''],
    ['기타',S.extras.join(', '),S.extras.map(e=>{const ei=EXTRAS_KO.indexOf(e);return ei>=0?EXTRAS_EN[ei]:e;}).join(', ')],
    ['','',''],
    ['최종 프롬프트','',buildPrompt()],
  ];
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='suno-prompt-'+Date.now()+'.csv';a.click();
}
